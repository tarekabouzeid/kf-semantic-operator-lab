# DataHub prerequisites for the local kind cluster.
#
# The bundled MySQL and neo4j are OFF: DataHub stores relational metadata in the
# Postgres "datahub" database in namespace lakehouse and uses the
# Elasticsearch-backed graph (global.graph_service_impl=elasticsearch). What
# remains is OpenSearch (single node) and Kafka (KRaft, single controller, no
# ZooKeeper) — the chart defaults are already single-node/kind-friendly; we only
# disable MySQL and trim heap/resources to fit a single node.
#
# NOTE: install this release as 'prerequisites' so the service names DataHub
# expects by default (prerequisites-kafka, opensearch-cluster-master) resolve.

elasticsearch:
  enabled: false

opensearch:
  enabled: true
  # Latest 2.19 patch. DataHub's primary search cluster is OpenSearch 2.x. The
  # chart's OpenSearch 3 entry is only a second cluster for migrations.
  image:
    tag: "2.19.7"
  # Chart 0.3.1 does not render without this: the bundled OpenSearch subchart
  # reads serviceMonitor.enabled and the parent chart never sets it.
  serviceMonitor:
    enabled: false
  singleNode: true
  opensearchJavaOpts: "-Xms512m -Xmx512m"
  resources:
    requests: {cpu: "100m", memory: "1024Mi"}
    limits: {memory: "1536Mi"}
  persistence:
    size: 3Gi
  # A laptop disk that is more than 85 to 90 percent full makes OpenSearch
  # refuse to create indices, and DataHub's setup job then fails. The lab holds
  # a few megabytes of metadata, so switch the disk watermarks off.
  extraEnvs:
    - name: cluster.routing.allocation.disk.threshold_enabled
      value: "false"

neo4j:
  enabled: false

mysql:
  enabled: false

# The chart's bundled Kafka is a bitnami image (no longer maintained), so it is
# disabled here. A single-node Apache Kafka (KRaft) is deployed separately via
# datahub/kafka.yaml, as Service 'prerequisites-kafka' — the same name
# the chart would have used — so DataHub's kafka bootstrap is unchanged.
kafka:
  enabled: false

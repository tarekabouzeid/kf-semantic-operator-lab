# DataHub v1.8.0 for the lab: GMS (the metadata service and its GraphQL API)
# and the React frontend, single replicas, minimal resources.
#
# Relational store: the "datahub" database in the lab Postgres (namespace
# lakehouse). Search and graph: the OpenSearch from the prerequisites release.
# Kafka: the single-node broker in kafka.yaml.
#
# Metadata-service authentication stays ON, the chart default. The chart
# generates the Secret datahub-auth-secrets, whose system_client_secret is the
# credential every client in the lab uses: the ingestion and annotate jobs, and
# ossiectl in the toolbox. They send it as
#   Authorization: Basic __datahub_system:<system_client_secret>
# The UI login is datahub / datahub.
global:
  datahub:
    version: v1.8.0
  graph_service_impl: elasticsearch
  sql:
    datasource:
      host: "postgres.lakehouse.svc.cluster.local:5432"
      hostForpostgresqlClient: "postgres.lakehouse.svc.cluster.local"
      port: "5432"
      url: "jdbc:postgresql://postgres.lakehouse.svc.cluster.local:5432/datahub"
      driver: "org.postgresql.Driver"
      database: "datahub"
      username: "datahub"
      password:
        secretRef: datahub-postgres
        secretKey: postgres-password
  elasticsearch:
    host: "opensearch-cluster-master"
    port: "9200"
  kafka:
    bootstrap:
      server: "prerequisites-kafka:9092"

datahub-gms:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
  resources:
    requests: {cpu: "100m", memory: "768Mi"}
    limits: {memory: "1536Mi"}

datahub-frontend:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
  resources:
    requests: {cpu: "50m", memory: "256Mi"}
    limits: {memory: "768Mi"}

# Ingestion runs as a Job from the toolbox image, so no actions pod.
acryl-datahub-actions:
  enabled: false
# Consumers run inside GMS.
datahub-mae-consumer:
  enabled: false
datahub-mce-consumer:
  enabled: false
datahub-ingestion-cron:
  enabled: false

mysqlSetupJob:
  enabled: false
postgresqlSetupJob:
  enabled: true

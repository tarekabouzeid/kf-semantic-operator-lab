# Identity gateway in front of the semantic server.
#
# The server runs in header auth mode: it believes whatever X-Semantic-User and
# X-Semantic-Role say. That is only safe behind a proxy that decides those
# headers itself. This nginx is that proxy. It exposes one path prefix per role
# and overwrites both headers, so a client cannot claim a role it was not given:
#
#   http://semantic-gateway.chat.svc.cluster.local:8080/analyst/mcp
#   http://semantic-gateway.chat.svc.cluster.local:8080/tx_analyst/mcp
#   http://semantic-gateway.chat.svc.cluster.local:8080/admin/mcp
#
# Any server path works after the prefix, for example /analyst/v1/models.
# In production the gateway authenticates the person first, or the server
# validates a JWT itself (server.auth.mode: jwt).
apiVersion: v1
kind: ConfigMap
metadata:
  name: semantic-gateway
  namespace: chat
data:
  default.conf: |
    # Resolve the server at request time, so the gateway starts before the
    # operator is installed.
    resolver kube-dns.kube-system.svc.cluster.local valid=10s;

    server {
      listen 8080;

      location = /healthz { return 200 "ok\n"; }

      location ~ ^/(analyst|tx_analyst|admin)/(.*)$ {
        set $role $1;
        set $rest $2;
        set $upstream semantic-operator-server.semantic-system.svc.cluster.local;

        proxy_set_header X-Semantic-User "lab-$role";
        proxy_set_header X-Semantic-Role $role;
        proxy_pass http://$upstream:8090/$rest$is_args$args;

        # MCP Streamable HTTP: keep responses streaming, keep calls open.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
      }

      location / { return 404 "use /analyst/, /tx_analyst/ or /admin/\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-gateway
  namespace: chat
spec:
  replicas: 1
  selector:
    matchLabels: {app: semantic-gateway}
  template:
    metadata:
      labels: {app: semantic-gateway}
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - name: conf
          configMap: {name: semantic-gateway}
---
apiVersion: v1
kind: Service
metadata:
  name: semantic-gateway
  namespace: chat
spec:
  selector: {app: semantic-gateway}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
